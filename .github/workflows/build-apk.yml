name: Build APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

# Serve per creare/aggiornare le Release.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Install MAUI Android workload
        run: dotnet workload install maui-android

      - name: Compute version
        id: ver
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "name=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "version_tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "is_main=false" >> "$GITHUB_OUTPUT"
          else
            echo "name=${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "version_tag=${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
            echo "is_main=true" >> "$GITHUB_OUTPUT"
          fi
          echo "code=${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Decode keystore
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/cardmaster.keystore"

      - name: Publish signed APK
        run: >
          dotnet publish src/CardMaster/CardMaster.csproj
          -c Release -f net10.0-android
          -p:AndroidPackageFormat=apk
          -p:ApplicationVersion=${{ steps.ver.outputs.code }}
          -p:ApplicationDisplayVersion=${{ steps.ver.outputs.name }}
          -p:AndroidKeyStore=true
          -p:AndroidSigningKeyStore="$RUNNER_TEMP/cardmaster.keystore"
          -p:AndroidSigningStorePass="${{ secrets.ANDROID_KEYSTORE_PASSWORD }}"
          -p:AndroidSigningKeyAlias="${{ secrets.ANDROID_KEY_ALIAS }}"
          -p:AndroidSigningKeyPass="${{ secrets.ANDROID_KEY_PASSWORD }}"

      - name: Locate APK
        id: apk
        run: |
          APK=$(find src/CardMaster/bin/Release/net10.0-android -name "*-Signed.apk" | head -n1)
          if [[ -z "$APK" ]]; then
            APK=$(find src/CardMaster/bin/Release/net10.0-android -name "*.apk" | head -n1)
          fi
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          echo "Trovato APK: $APK"

      - name: Publish versioned release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.version_tag }}
          prerelease: ${{ steps.ver.outputs.prerelease }}
          name: ${{ steps.ver.outputs.name }}
          files: ${{ steps.apk.outputs.path }}
          fail_on_unmatched_files: true

      - name: Update latest prerelease
        if: steps.ver.outputs.is_main == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          prerelease: true
          name: ${{ steps.ver.outputs.name }}
          files: ${{ steps.apk.outputs.path }}
          fail_on_unmatched_files: true

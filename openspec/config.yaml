schema: spec-driven

# Project context — shown to AI when creating artifacts.
context: |
  CardMaster — app per conservare e mostrare i codici a barre delle carte fedeltà.
  Offline-first. Strategia a due fasi di rilascio (vedi PLAN.md nella root):
    - v1: completamente offline, nessun server. Auth = solo sblocco locale. Condivisione via QR self-contained.
    - v2 (rimandato): backend .NET 10 per auth online, backup e multi-device.
  Le decisioni qui sotto sono GIA' PRESE: le proposte non devono rimetterle in discussione.

  === v1 (offline) ===
  Prodotto: app Android, 100% offline. Aprire una carta, scansionarne una nuova e condividerla
  funzionano senza rete e senza account.

  Client: .NET MAUI (solo Android). SQLite locale IN CHIARO (SQLitePCLRaw.bundle_e_sqlite3).
  Scansione con ML Kit (BarcodeScanning.Native.Maui), rendering barcode con ZXing.Net + SkiaSharp.
  (Decisione 24 lug 2026: rimossa la cifratura SQLCipher — bundle_e_sqlcipher deprecato e cifratura
  non essenziale per la v1. Eventuale reintroduzione: SQLite3MC.PCLRaw.bundle, mantenuto.)

  Autenticazione v1: NESSUNA gate di sblocco applicativa. L'app si apre direttamente sulla lista carte
  (nessun account, nessun server, nessun prompt biometrico o PIN). La protezione "telefono in mano ad
  altri" e' delegata al lockscreen di Android. (Decisione 24 lug 2026: rimossi biometria e PIN applicativi;
  la change maui-unlock e' annullata.)

  Modello dati: carte locali al device. Id carte generati dal CLIENT (GUID/ULID) — restano validi con la
  futura sync. Cancellazioni logiche con tombstone (mai DELETE fisico), gia' ora.

  Condivisione v1: una carta si condivide mostrando un QR code self-contained che incapsula tutti i dati
  (emittente/nome, barcode, barcodeFormat, colore/logo id). L'altro device lo scansiona e crea una COPIA
  indipendente (nessun legame persistente — il barcode fedelta' e' immutabile). Peer-to-peer, nessun
  server. Alla ricezione: controllo duplicati (stesso emittente + barcode). Payload versionato (campo v).

  Riconoscimento emittente: catalogo emittenti bundle locale statico (seed nell'app) per nome/logo/formato
  atteso; nessuna sync del catalogo in v1.

  Build & distribuzione (fuori Play Store): pipeline GitHub Actions che compila e FIRMA l'APK (keystore
  come secret CI, mai nel repo) e pubblica una Release. Auto-update: l'app legge direttamente la Release
  GitHub con tag "latest" (API pubbliche, nessun manifest/server aggiuntivo), scarica l'APK, VERIFICA
  checksum/firma e installa via package installer intent.

  Repository GitHub pubblico (decisione 25 lug 2026, change maui-auto-update): necessario perche'
  l'auto-update legge le API Releases senza token incorporato nell'APK. Verificato che repo e cronologia
  non contengano segreti. PRIMA DI OGNI COMMIT/PUSH: rivedere il diff per escludere segreti o dati
  sensibili (chiavi, token, credenziali) - il repo e' visibile a chiunque. Keystore e credenziali CI
  restano solo come secret GitHub Actions, mai nel repo.

  Sicurezza v1: SQLCipher sul device. Niente TLS/E2E (nessuna rete nel core; l'unica rete e' l'update opt-in).

  === v2 (backend — riferimento, per non chiudere porte ora) ===
  Backend: .NET 10, Minimal API, CQRS a vertical slice (una cartella per feature: comando+handler+validator).
  EF Core + SQLite, WAL abilitato, scritture serializzate da una coda (SQLite = un solo writer). Niente read
  model separato, event sourcing o MediatR. Docker + docker compose, reverse proxy per il TLS.

  Autenticazione v2: primo accesso online (credenziali o Google con Authorization Code + PKCE, nessun client
  secret nell'APK) -> access token breve + refresh token lungo con rotazione in SecureStorage. La biometria
  resta solo sblocco locale. Refresh token scaduto -> app usabile in sola lettura, si blocca solo la sync.

  Sincronizzazione v2: cursore = contatore monotono Seq assegnato dal server (INTEGER PRIMARY KEY
  AUTOINCREMENT su ChangeLog append-only). Timestamp client solo tie-breaker per il last-write-wins, mai
  cursore. OperationId client-generato per l'idempotenza sui retry.

  Convenzioni: commit convenzionali. CORS non pertinente per il client MAUI nativo (rilevante solo con un
  eventuale frontend web futuro).

  La compilazione senza errori e' OBBLIGATORIA: ogni change include un passo finale di verifica build
  (dotnet build, 0 errori) come criterio di accettazione. Vedi docs/technical-notes.md per le trappole
  tecniche gia' incontrate (es. provider SQLCipher: usare sqlite-net-base, non sqlite-net-pcl).

